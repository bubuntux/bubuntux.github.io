name: Deploy site to GitHub Pages

# Every pushed branch is built; only main deploys.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

# One run per branch at a time; a running deploy finishes instead of being cancelled.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31

      - uses: cachix/cachix-action@v17
        with:
          name: devenv

      - name: Install devenv
        run: nix profile add nixpkgs#devenv

      - name: Build site
        # Same zola, typst and fonts as local `devenv shell`, pinned by devenv.lock.
        run: devenv shell -- site-build

      - name: Check CNAME
        run: |
          # static/CNAME keeps the custom domain version-controlled. For Actions
          # deploys GitHub reads the domain from Settings > Pages and ignores this
          # file, but it is cheap insurance, so refuse to deploy without it.
          # https://docs.github.com/en/pages/configuring-a-custom-domain-for-your-github-pages-site/managing-a-custom-domain-for-your-github-pages-site
          test -s public/CNAME || { echo "::error::public/CNAME missing or empty; refusing to deploy"; exit 1; }

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    # Only this job can publish; the build job above runs with read-only access.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
